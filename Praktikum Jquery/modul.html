<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum jQuery</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: monospace;
            margin: 0;
            padding: 20px;
            color: #315b3a;

            background-color: #fffdf7;
            background-image:
                linear-gradient(45deg, #e85d5d 25%, transparent 25%),
                linear-gradient(-45deg, #e85d5d 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #e85d5d 75%),
                linear-gradient(-45deg, transparent 75%, #e85d5d 75%);
            background-size: 50px 50px;
            background-position:
                0 0,
                0 25px,
                25px -25px,
                -25px 0;
        }

        .wrap {
            max-width: 820px;
            margin: auto;
            background: #fffdf7;
            border: 4px solid #315b3a;
            padding: 24px;
            box-shadow: 8px 8px 0 #e85d5d;
        }

        section {
            border: 3px solid #315b3a;
            background: #f4f8e9;
            padding: 20px;
            margin: 22px 0;
        }

        h1 {
            color: #d94f4f;
        }

        h2, h3 {
            color: #477a4d;
        }

        .card {
            display: flex;
            gap: 18px;
            align-items: center;
            background: white;
            border: 3px solid #315b3a;
            padding: 18px;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #315b3a;
            flex: none;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .skill {
            display: inline-block;
            background: #f7e8a4;
            border: 2px solid #315b3a;
            border-radius: 15px;
            padding: 4px 10px;
            margin: 3px;
        }

        button {
            border: 3px solid #315b3a;
            background: #e85d5d;
            color: white;
            padding: 8px 15px;
            font-family: monospace;
            font-weight: bold;
            cursor: pointer;
            margin: 4px;
            border-radius: 7px;
        }

        button.ghost {
            background: white;
            color: #315b3a;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            border: 3px solid #315b3a;
            margin-top: 4px;
            font-family: monospace;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        .err {
            color: #c0392b;
            display: none;
            margin-top: 4px;
        }

        .ok {
            color: #477a4d;
            display: none;
            margin-top: 8px;
            background: #e2f1df;
            border: 2px solid #477a4d;
            padding: 8px;
        }
    </style>
</head>

<body>

<div class="wrap">

    <h1>Praktikum jQuery</h1>

    <section>
        <h2>Manipulasi DOM</h2>

        <div class="card" id="profileCard">
            <div class="avatar">
                <img src="kono.png" alt="Foto">
            </div>

            <div>
                <h3 id="profileName">Shinta Ayuwidati</h3>

                <div>Information System Student</div>

                <div id="skills">
                    <span class="skill">HTML5</span>
                    <span class="skill">CSS3</span>
                    <span class="skill">JavaScript</span>
                    <span class="skill">jQuery</span>
                </div>
            </div>
        </div>

        <button id="btnGantiNama">Ganti Nama</button>
        <button id="btnSkill">Tambah Skill</button>
        <button id="btnAnimasi">Efek Fade & Slide</button>
        <button id="btnReset" class="ghost">Reset</button>
    </section>

    <section>
        <h2>Form Validation</h2>

        <form id="contactForm" novalidate>

            <label>Nama Lengkap</label>
            <input id="nama" type="text">
            <div class="err" id="errNama">
                Nama minimal 3 karakter
            </div>

            <label>Email</label>
            <input id="email" type="text">
            <div class="err" id="errEmail">
                Format email tidak valid
            </div>

            <label>Pesan</label>
            <textarea id="pesan" rows="3"></textarea>
            <div class="err" id="errPesan">
                Pesan minimal 10 karakter
            </div>

            <button type="submit">Kirim Pesan</button>
            <button type="button" id="btnResetForm" class="ghost">
                Reset
            </button>

            <div class="ok" id="successMessage">
                Pesan berhasil dikirim!
            </div>
        </form>
    </section>

</div>

<script>
$(function () {

    let skillIndex = 0;

    const skillBaru = [
        'Bootstrap',
        'PHP',
        'MySQL',
        'Git',
        'React'
    ];

    $('#btnGantiNama').click(function () {
        $('#profileName').text('Shinta Ayuwidati');
    });

    $('#btnSkill').click(function () {

        if (skillIndex < skillBaru.length) {

            $('<span class="skill"></span>')
                .text(skillBaru[skillIndex])
                .hide()
                .appendTo('#skills')
                .fadeIn();

            skillIndex++;
        }
    });

    $('#btnAnimasi').click(function () {

        $('#profileCard')
            .fadeOut(300)
            .fadeIn(600)
            .slideUp(200)
            .slideDown(300);

    });

    $('#btnReset').click(function () {

        $('#profileName').text('Shinta Ayuwidati');

        $('#skills .skill').slice(4).remove();

        skillIndex = 0;
    });

    const emailRegex =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    $('#contactForm').submit(function (e) {

        e.preventDefault();

        let valid = true;

        const nama = $('#nama').val().trim();
        const email = $('#email').val().trim();
        const pesan = $('#pesan').val().trim();

        if (nama.length < 3) {
            $('#errNama').show();
            valid = false;
        } else {
            $('#errNama').hide();
        }

        if (!emailRegex.test(email)) {
            $('#errEmail').show();
            valid = false;
        } else {
            $('#errEmail').hide();
        }

        if (pesan.length < 10) {
            $('#errPesan').show();
            valid = false;
        } else {
            $('#errPesan').hide();
        }

        if (valid) {

            $('#successMessage')
                .fadeIn()
                .delay(1500)
                .fadeOut();

            $('#contactForm')[0].reset();
        }
    });

    $('#btnResetForm').click(function () {

        $('#contactForm')[0].reset();
        $('.err').hide();

    });

});
</script>

</body>
</html>
