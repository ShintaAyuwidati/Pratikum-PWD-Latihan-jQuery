<!DOCTYPE html>
<html>

<head>
    <title>Cek Ganjil Genap</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            background-image: url("kalkul.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .kalkulator {
            background: rgb(164, 243, 239);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        input {
            padding: 10px;
            margin: 5px;
            font-size: 16px;
            width: 80%;
            box-sizing: border-box;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            font-size: 16px;
            background: #f8b0e1;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #2980b9;
        }

        .hasil {
            font-size: 28px;
            font-weight: bold;
            color: #2c3e50;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="kalkulator">
        <h2>🔢 Cek Ganjil / Genap</h2>

        <input type="number" id="angka" placeholder="Masukkan Angka">
        <br>

        <button onclick="cekAngka()">Cek</button>

        <div class="hasil">
            <span id="hasilAngka"></span>
        </div>
    </div>

    <script>
        function cekAngka() {
            let angka = parseInt(document.getElementById('angka').value);

            if (angka % 2 === 0) {
                document.getElementById('hasilAngka').innerHTML = "Angka Genap";
            } else {
                document.getElementById('hasilAngka').innerHTML = "Angka Ganjil";
            }
        }
    </script>

</body>

</html>
